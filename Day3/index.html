<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Order summary card</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
      html {
        background-color: hsl(224, 23%, 55%);
      }
      body {
        height: 100vh;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        font-family: "Red Hat Display";
      }
      .card {
        width: 270px;
        min-height: 450px;
        background-color: white;
        margin: 5%;
        border-radius: 15px;
      }
      .pic {
        width: 100%;
        height: 33%;
        background-image: url(/images/illustration-hero.svg);
        background-size: cover;
        border-top-left-radius: 15px;
        border-top-right-radius: 15px;
      }
      h1 {
        font-size: 20px;
        color: hsl(223, 47%, 23%);
        text-align: center;
        margin: 5%;
        font-weight: 800;
        margin-top: 10%;
      }
      .first-p {
        text-align: center;
        font-size: 13px;
        color: hsl(224, 23%, 55%);
      }
      .count {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 2%;
        margin: 7%;
        background-color: hsla(224, 23%, 55%, 0.068);
        border-radius: 10px;
      }
      h2 {
        font-size: 13px;
        font-weight: 800;
        color: hsl(223, 47%, 23%);
      }
      .second-p {
        color: hsl(224, 23%, 55%);
        font-size: 12px;
      }
      .sec-count {
        text-wrap: nowrap;
        width: 80px;
        height: 45px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex-wrap: nowrap;
      }
      .music-words {
        display: flex;
      }
      .music-words img {
        width: 24%;
        height: 20%;
        align-self: center;
        margin: 4%;
      }
      .change {
        border: none;
        background: none;
        margin-right: 2%;
        font-size: x-small;
        font-weight: bolder;
        cursor: pointer;
        text-decoration: underline;
        color: hsl(245, 75%, 52%);
      }
      .buttons {
        display: flex;
        flex-direction: column;
      }
      .proceed,
      .cancel {
        border: none;
        background: none;
        padding: 4%;
        margin-left: 5%;
        margin-right: 5%;
        font-size: 11px;
        font-weight: 600;
        margin-top: 1%;
        margin-bottom: 2%;
      }
      .proceed {
        background-color: hsl(245, 75%, 52%);
        border-radius: 6px;
        color: white;
        box-shadow: 0 8px 15px rgba(79, 70, 229, 0.35);
      }
      .cancel {
        color: hsl(224, 23%, 55%);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="pic"></div>
      <h1>Order Summary</h1>
      <p class="first-p">
        You can now listen to millions of songs, audiobooks, and podcasts on any
        device anywhere you like!
      </p>
      <div class="count">
        <div class="music-words">
          <img src="/images/icon-music.svg" alt="music icon" />
          <div class="sec-count">
            <h2>Annual Plan</h2>
            <p class="second-p">$59.99/year</p>
          </div>
        </div>
        <button class="change">Change</button>
      </div>
      <div class="buttons">
        <button class="proceed">Proceed to Payment</button>
        <button class="cancel">Cancel Order</button>
      </div>
    </div>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Your Name Here</a>.
    </div>
  </body>
</html>
